plugins {
    id "com.android.application"
    id "jacoco"
}

android {
    compileSdk = 37

    defaultConfig {
        applicationId "uk.co.ourfriendirony.medianotifierandroid"
        minSdkVersion defaultMinSdkVersion
        targetSdkVersion defaultTargetSdkVersion
        versionCode 1
        versionName "0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
            enableUnitTestCoverage true
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/LICENSE"]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    namespace "uk.co.ourfriendirony.medianotifier"
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.appcompat:appcompat:1.8.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.2"
    implementation "androidx.work:work-runtime-ktx:2.12.0"
    implementation "androidx.fragment:fragment-ktx:1.9.1"
    implementation "androidx.core:core-ktx:1.19.1"
    implementation "androidx.core:core-splashscreen:1.2.0"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.22.3"
    implementation "com.squareup.okhttp3:okhttp:5.5.0"
    implementation "com.squareup.tape2:tape:2.0.0-beta1"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-core:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.11.0'
    implementation("com.fasterxml.jackson.module:jackson-module-kotlin:2.22.3")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.22.3")
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.junit.jupiter:junit-jupiter-api:6.1.3"
    testImplementation "org.jacoco:org.jacoco.core:0.8.15"
    implementation "androidx.work:work-runtime-ktx:2.12.0"
}

repositories {
    mavenCentral()
}
