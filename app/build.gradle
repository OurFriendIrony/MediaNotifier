plugins {
    id "com.android.application"
    id "kotlin-android"
    id "jacoco"
    }

android {
    defaultConfig {
        applicationId "uk.co.ourfriendirony.medianotifierandroid"
        minSdkVersion defaultMinSdkVersion
        targetSdkVersion defaultTargetSdkVersion
        versionCode 1
        versionName "0.1"
        compileSdk ver_sdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
            enableUnitTestCoverage true
        }
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/LICENSE"]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    namespace "uk.co.ourfriendirony.medianotifier"
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation "androidx.fragment:fragment-ktx:1.8.1"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.13.3"
    implementation "com.squareup.okhttp3:okhttp:4.9.0"
    implementation "com.squareup.tape2:tape:2.0.0-beta1"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-core:1.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.5.1'
    implementation("com.fasterxml.jackson.module:jackson-module-kotlin:2.13.3")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.13.3")
    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.8.2"
    testImplementation "org.jacoco:org.jacoco.core:0.8.8"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
}

configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        def requested = details.requested
        if (requested.group == "com.android.support") {
            if (!requested.name.startsWith("multidex")) {
                details.useVersion "25.3.0"
            }
        }
    }
}

repositories {
    mavenCentral()
}
